function qHTML(q,fid,val){
  const id=`${fid}-${q.id}`, req=q.req?' <span class="req">*</span>':'', hint=q.hint?`<div class="hint">${esc(q.hint)}</div>`:'';
  if(q.type==="text"||q.type==="number") return `<div class="q"><label for="${id}">${esc(q.l)}${req}</label>${hint}<input id="${id}" name="${q.id}" type="${q.type==="number"?"number":"text"}" ${q.type==="number"?'min="0" inputmode="numeric"':''} ${q.req?'required':''} value="${esc(val??"")}"></div>`;
  if(q.type==="textarea") return `<div class="q"><label for="${id}">${esc(q.l)}${req}</label>${hint}<textarea id="${id}" name="${q.id}">${esc(val??"")}</textarea></div>`;
  if(q.type==="radio"||q.type==="check"){
    const t=q.type==="radio"?"radio":"checkbox", arr=Array.isArray(val)?val:[val];
    return `<div class="q" role="group" aria-labelledby="${id}-l"><div class="lbl" id="${id}-l">${esc(q.l)}${req}${q.type==="check"?' <small class="hint">(marque quantas quiser)</small>':''}</div>${hint}<div class="opts">${q.o.map((o,i)=>`<label class="opt"><input type="${t}" id="${id}-${i}" name="${q.id}" value="${esc(o)}" ${arr.includes(o)?'checked':''} ${q.req&&t==="radio"?'required':''}><span>${esc(o)}</span></label>`).join("")}</div></div>`;
  }
  if(q.type==="scale") return `<div class="q" role="group" aria-labelledby="${id}-l"><div class="lbl" id="${id}-l">${esc(q.l)}</div><div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" id="${id}-${n}" name="${q.id}" value="${n}" ${String(val)===String(n)?'checked':''}><span>${n}</span></label>`).join("")}</div><div class="scale-ends"><span>1 · ${SCALE_ENDS[0]}</span><span>5 · ${SCALE_ENDS[1]}</span></div></div>`;
}

function collect(f){
  const frm=$("#frm"), out={};
  f.sections.forEach(s=>s.qs.forEach(q=>{
    if(q.type==="check") out[q.id]=[...frm.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i=>i.value);
    else if(q.type==="radio"||q.type==="scale"){const c=frm.querySelector(`input[name="${q.id}"]:checked`);out[q.id]=c?(q.type==="scale"?Number(c.value):c.value):null}
    else{const el=frm.querySelector(`[name="${q.id}"]`);out[q.id]=el?el.value.trim():""}
  }));
  return out;
}
async function submit(f){
  const st=$("#st"), btn=$("#send"), ans=collect(f);
  const missing=f.sections.flatMap(s=>s.qs).filter(q=>q.req&&(!ans[q.id]||(Array.isArray(ans[q.id])&&!ans[q.id].length)));
  if(missing.length){st.className="status err";st.textContent="Preencha: "+missing.map(q=>q.l).join(", ")+".";return}
  if(!db||!uid){st.className="status err";st.textContent="Não foi possível enviar: acesso de colaborador necessário.";return}
  btn.disabled=true;st.className="status";st.textContent="Enviando…";
  try{
    const ref=db.doc("respostas/"+uid), snap=await ref.get();
    const body=snap.exists?JSON.parse(JSON.stringify(snap.data())):{forms:{}};
    body.forms=body.forms||{};
    body.forms[f.id]={respostas:ans,enviadoEm:new Date().toISOString()};
    body.nome=ans.nome||body.nome||"";
    if(ans.empresa) body.empresa=ans.empresa;
    if(ans.area) body.area=ans.area;
    body.atualizadoEm=new Date().toISOString();
    await ref.set(body);
    store.set("draft-"+f.id,null);
    st.className="status ok";st.textContent="Respostas enviadas. Obrigado!";
  }catch(e){
    st.className="status err";
    st.textContent=e&&e.code==="invalid_argument"?"Seu acesso permite apenas visualizar. Peça acesso de colaborador à CSBIM.":"Não foi possível enviar agora. Tente novamente em instantes.";
    if(e&&e.code==="invalid_argument") readOnly=true;
  }finally{btn.disabled=readOnly}
}

/* Uma resposta por pessoa (Pacaembu) ou por empresa (projetistas): vale o envio mais recente. */
function latestBy(list,keyFn){
  const sorted=list.slice().sort((a,b)=>String(b.at||"").localeCompare(String(a.at||"")));
  const kept=[];
  sorted.forEach(it=>{const k=keyFn(it);if(!k){kept.push(it);return}
    const dup=kept.find(o=>{const ok=keyFn(o);return ok&&(ok===k||(k.length>=4&&ok.startsWith(k))||(ok.length>=4&&k.startsWith(ok)))});
    if(dup){dup._dups=(dup._dups||0)+1}else kept.push(it)});
  return kept;
}
function split(docs){
  const sub=fid=>docs.filter(d=>d.forms?.[fid]).map(d=>({d,at:d.atualizadoEm,r:d.forms[fid].respostas||{}}));
  const byName=it=>norm(it.r.nome||it.d.nome);
  const mat=latestBy(sub("maturidade"),byName), pro=latestBy(sub("processos"),byName), tec=latestBy(sub("tecnologia"),byName);
  const isInt=it=>/pacaembu/.test(norm(it.r.empresa||it.d.empresa)), byEmp=it=>norm(it.r.empresa||it.d.empresa)||norm(it.r.nome);
  const prjAll=sub("projetistas"), prjEAll=sub("projetistas_edif");
  const edq=latestBy(sub("edif_equipe"),byName);
  const internos=prjAll.filter(isInt), internosE=prjEAll.filter(isInt);
  const prj=latestBy(prjAll.filter(it=>!isInt(it)),byEmp), prjE=latestBy(prjEAll.filter(it=>!isInt(it)),byEmp);
  const pessoas=latestBy([...mat,...pro,...tec].map(it=>({...it,_dups:0})),byName);
  const envios={mat:sub("maturidade").length,pro:sub("processos").length,tec:sub("tecnologia").length,prj:prjAll.length,prjE:prjEAll.length,edq:sub("edif_equipe").length};
  return {mat,pro,tec,prj,prjE,edq,internos,internosE,pessoas,envios};
}

const PAL=["#003D4C","#5E8C99","#FFB81C","#B9CBD1","#14262B","#0F7083","#D9A21B"];
function donutChart(entries,total,unit,order){
  if(!entries.length) return `<div class="empty">Sem respostas ainda.</div>`;
  let cols;
  if(order){entries=entries.slice().sort((a,b)=>{const ia=order.indexOf(a[0]),ib=order.indexOf(b[0]);return (ia<0?99:ia)-(ib<0?99:ib)});
    const sc=order.length<=3?["#003D4C","#5E8C99","#E4002B"]:["#003D4C","#5E8C99","#FFB81C","#E4002B"];
    cols=entries.map(e=>{const i=order.indexOf(e[0]);return i<0?"#B9CBD1":sc[Math.min(i,sc.length-1)]});}
  else cols=entries.map((e,i)=>PAL[i%PAL.length]);
  const sum=entries.reduce((s,e)=>s+e[1],0);
  if(total>sum){entries=[...entries,["Sem resposta",total-sum]];cols=[...cols,"#DDE6E9"]}
  const all=Math.max(total,sum)||1, R=60, C=2*Math.PI*R; let off=0;
  const arcs=entries.map(([k,v],i)=>{const len=v/all*C;const a=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${cols[i]}" stroke-width="30" stroke-dasharray="${Math.max(0,len-1.5).toFixed(2)} ${(C-len+1.5).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 80 80)"><title>${esc(k)}: ${v} (${Math.round(v/all*100)}%)</title></circle>`;off+=len;return a}).join("");
  return `<div class="donut"><svg viewBox="0 0 160 160" role="img" aria-label="Gráfico de rosca">${arcs}<text x="80" y="80" text-anchor="middle" class="dn">${total}</text><text x="80" y="99" text-anchor="middle" class="du">${esc(unit)}</text></svg>
  <ul class="legend">${entries.map(([k,v],i)=>`<li><i style="background:${cols[i]}"></i><span>${esc(k)}</span><b>${v} <small>· ${Math.round(v/all*100)}%</small></b></li>`).join("")}</ul></div>`;
}

function viewProjetistas(S,E){

  if(semCde) rows.push({lac:`${semCde} empresas sem experiência com CDE`,acao:"Treinamento de entrada no CDE e protocolo de envio de arquivos",etapa:2,v:null,pri:semCde>=N/2?"Alta":"Média",src:"Projetistas"});
  const nao=cnt("bim","Ainda não"); if(nao) rows.push({lac:`${nao} empresas ainda não trabalham em BIM`,acao:"Orientação e requisitos mínimos de entrega para quem está começando",etapa:3,v:null,pri:"Média",src:"Projetistas"});
  const naoCad=LIST.filter(x=>x.r.caderno==="Não"); if(naoCad.length) rows.push({lac:`${naoCad.length} empresa${naoCad.length>1?'s':''} não pode${naoCad.length>1?'m':''} seguir o Caderno BIM hoje (${naoCad.map(x=>esc(x.r.empresa)).join(", ")})`,acao:"Conversa individual e plano de transição",etapa:3,v:null,pri:"Alta",src:"Projetistas"});
  const prio={Alta:0,Média:1,Baixa:2};rows.sort((a,b)=>prio[a.pri]-prio[b.pri]);

   <div class="cards">
    ${kpi(`${usaBim} de ${N}`,"já trabalham em BIM (todos ou alguns projetos)","dark")}

    ${kpi(`${semCde} de ${N}`,"sem experiência com CDE","red")}
    ${kpi(mod,"profissionais que modelam em 3D (soma)")}
   </div>
   ${N?lead(`<b>Resumo:</b> ${usaBim} das ${N} empresas já usam BIM, e ${cad} aceitam seguir o Caderno BIM. O ponto mais fraco é o ambiente de troca de arquivos: <b>${semCde}</b> nunca trabalharam com CDE.`):''}
   <div class="grid2">
   ${chartCard("1. Nível de BIM",`${N} empresas`,donutChart(tally(prj,"bim"),N,"empresas",["Sim, em todos os projetos","Em alguns projetos","Ainda não"]))}
   ${chartCard(`2. Versão do ${SOFT}`,`${N} empresas`,donutChart(tally(prj,"versao"),N,"empresas",["2026","2025","2024 ou anterior","Não usa"]))}

   ${chartCard("4. Seguir o Caderno BIM da Pacaembu",`${N} empresas`,donutChart(tally(prj,"caderno"),N,"empresas",["Sim","Sim, com adaptação","Não"]))}

   ${chartCard("6. Disciplinas atendidas",`${N} empresas`,countBars(tally(prj,"disc"),N,"empresas"),"Cada empresa podia marcar várias.")}
   ${E?`${chartCard("Nível de detalhe do modelo",`${N} empresas`,donutChart(tally(prj,"lod"),N,"empresas",["Detalhamento para obra","Projeto executivo","Estudo / anteprojeto"]))}

   ${chartCard("Quantitativos saem do modelo",`${N} empresas`,donutChart(tally(prj,"quant"),N,"empresas",["Sim","Em parte","Não"]))}

   </div>
   ${chartCard("7. Empresa por empresa","ordenadas pelo nível de BIM",N?`<div class="tbl"><table class="info"><thead><tr><th>Empresa</th><th>BIM</th><th>${SOFT}</th><th>IFC</th><th>CDE</th><th>Caderno BIM</th><th class="num">Modelam 3D</th></tr></thead><tbody>${tbl.map(x=>{const r=x.r;return `<tr><td><b>${esc(r.empresa||"—")}</b><br><small class="muted">${esc(r.nome||"")}${x._dups?` · ${x._dups} envio${x._dups>1?'s':''} repetido${x._dups>1?'s':''} ignorado${x._dups>1?'s':''}`:''}</small></td><td>${tag(r.bim,["Sim, em todos os projetos"],["Ainda não"])}</td><td>${tag(r.versao,["2026"],["Não usa","2024 ou anterior"])}</td><td>${tag(r.ifc,["Sim"],["Não"])}</td><td>${tag(r.cde,["Autodesk Docs / Forma","BIM 360","Outro CDE"],["Nenhuma"])}</td><td>${tag(r.caderno,["Sim"],["Não"])}</td><td class="num">${esc(r.equipe??"–")}</td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty">Ainda não há respostas de projetistas de ${SEG}.</div>`,"Azul = pronto para o BIM · vermelho = precisa de atenção.")}
   ${obs.length?chartCard("8. O que os projetistas comentaram",`${obs.length} comentário${obs.length>1?'s':''}`,`<ul class="facts">${obs.map(x=>`<li><b>${esc(x.r.empresa)}</b>: ${esc(x.r.obs)}</li>`).join("")}</ul>`):''}

   <h2 class="block">Pré-plano de ação · Projetistas de ${SEG}</h2>
   ${rows.length?planTable(rows):`<div class="empty">Nenhuma lacuna identificada.</div>`}`;
}
function planTable(rows){return `<div class="tbl"><table class="plan"><thead><tr><th>Prioridade</th><th>Lacuna</th><th>Ação sugerida</th><th>Etapa</th><th class="num">Nível</th></tr></thead><tbody>${rows.map(p=>`<tr><td><span class="pri p-${p.pri==="Alta"?"a":p.pri==="Média"?"m":"b"}">${p.pri==="Alta"?"▲":p.pri==="Média"?"■":"▼"} ${p.pri}</span></td><td>${p.lac}<br><small class="muted">${esc(p.src)}</small></td><td>${esc(p.acao)}</td><td>${esc(ETAPAS[p.etapa])}</td><td class="num">${p.v==null||p.src==="Processos"?"–":lvl(p.v)+"%"}</td></tr>`).join("")}</tbody></table></div>`}
function viewTodas(docs,S){
  const keep=new Set([...S.mat,...S.pro,...S.tec,...S.prj,...S.prjE,...S.edq].map(x=>x.d));
  const intern=new Set([...S.internos,...S.internosE].map(x=>x.d));
  const rows=docs.slice().sort((a,b)=>String(b.atualizadoEm||"").localeCompare(String(a.atualizadoEm||"")));
  const grupo=d=>d.forms?.edif_equipe?"Pacaembu · Edificações":d.forms?.projetistas_edif?"Projetista · Edificações":d.forms?.projetistas?"Projetista · Loteamentos":"Pacaembu";
  const st=d=>intern.has(d)?'<span class="tag b">Fora da análise (empresa Pacaembu)</span>':keep.has(d)?'<span class="tag g">Considerada</span>':'<span class="tag">Repetida · vale a mais recente</span>';
  return `
   <p class="cnote" style="font-size:14px">Lista completa da planilha, sem nenhuma alteração. A coluna <b>Situação</b> mostra se o envio entra na análise. Use a lixeira só se quiser apagar o envio de vez da planilha.</p>
   ${rows.length?`<div class="tbl"><table class="list"><thead><tr><th>Nome</th><th>Grupo</th><th>Área / empresa</th><th>Questionário</th><th>Enviado em</th><th>Situação</th></tr></thead><tbody>
    ${rows.map(d=>`<tr data-id="${esc(d._id||"")}"><td>${esc(d.nome||"—")}</td><td>${grupo(d)}</td><td>${esc(d.empresa||d.area||"—")}</td><td>${FORMS.filter(f=>d.forms?.[f.id]).map(f=>esc(f.nav)).join(", ")}</td><td>${d.atualizadoEm?new Date(d.atualizadoEm).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"—"}</td><td>${st(d)}</td></tr>`).join("")}
   </tbody></table></div>
   ${showSample?'':`<h2 class="block">Respostas completas</h2><div style="display:flex;flex-direction:column;gap:10px">${rows.map(d=>`<details data-id="${esc(d._id||"")}"><summary>${esc(d.nome||"Sem nome")} ${d.empresa?'· '+esc(d.empresa):''} <small class="muted">· ${FORMS.filter(f=>d.forms?.[f.id]).map(f=>esc(f.nav)).join(", ")}</small></summary><dl>${FORMS.filter(f=>d.forms?.[f.id]).map(f=>{const r=d.forms[f.id].respostas||{};return `<dt style="color:var(--red);font-weight:700;font-family:var(--display)">${esc(f.title)}</dt>`+f.sections.flatMap(s=>s.qs).map(q=>{const v=r[q.id];const t=Array.isArray(v)?v.join(", "):(v??"");return t===""||t===null?"":`<dt>${esc(q.l)}</dt><dd>${esc(t)}</dd>`}).join("")}).join("")}</dl></details>`).join("")}</div>`}`
   :`<div class="empty">Nenhuma resposta ainda.</div>`}`;
}

function render(){renderTabs();const c=current();if(c==="respostas")renderResults();else renderForm(FORMS.find(f=>f.id===c))}

isAdmin=true;
function current(){return "respostas"}
function renderTabs(){
  if(!AUTH&&!showSample){$("#tabs").innerHTML=`<a href="#" aria-current="page">Área de admin</a>`;return}
  let S=null;try{S=split(showSample?sampleDocs():allDocs)}catch(e){}
  const t=(id,label,n)=>`<a href="#${id}" data-v="${id}" ${VIEW===id?'aria-current="page"':''}>${label}${n!=null?` <span class="n">${n}</span>`:''}</a>`;
  $("#tabs").innerHTML=t("pacaembu","Loteamentos · Equipe",S?S.pessoas.length:null)+t("edifequipe","Edificações · Equipe",S?S.edq.length:null)+t("projetistas","Projetistas · Loteamentos",S?S.prj.length:null)+t("edificacoes","Projetistas · Edificações",S?S.prjE.length:null)+t("todas","Todas as respostas",S?(showSample?sampleDocs():allDocs).length:null);
  $("#tabs").querySelectorAll("a[data-v]").forEach(a=>a.onclick=e=>{e.preventDefault();VIEW=a.dataset.v;try{history.replaceState(null,"","#"+VIEW)}catch(_){};renderTabs();renderResults();window.scrollTo({top:0,behavior:"smooth"})});
}
function toDocs(rows){return rows.map(r=>({_id:r.enviadoEm,nome:r.nome,area:r.area,empresa:r.empresa,atualizadoEm:r.enviadoEm,forms:{[r.form]:{respostas:r.respostas||{},enviadoEm:r.enviadoEm}}}))}
let RAW=[],AUTH=null;
const _rr=renderResults;
renderResults=function(){_rr();decorate()};
const TRASH='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
function trashCtl(id,box){
  const show=()=>{box.innerHTML=`<button type="button" class="trash" title="Excluir esta resposta" aria-label="Excluir esta resposta">${TRASH}</button>`;box.querySelector("button").onclick=e=>{e.preventDefault();e.stopPropagation();ask()}};
  const ask=()=>{box.innerHTML='<span class="cf">Excluir?</span><button type="button" class="cfy">Sim</button><button type="button" class="cfn">Não</button>';box.querySelector(".cfy").onclick=e=>{e.preventDefault();e.stopPropagation();del(id,box)};box.querySelector(".cfn").onclick=e=>{e.preventDefault();e.stopPropagation();show()}};
  show();
}
function decorate(){
  if(showSample||!AUTH)return;
  const tb=document.querySelector("#view table.list");
  if(tb){const hr=tb.querySelector("thead tr");if(hr&&!hr.querySelector(".act"))hr.insertAdjacentHTML("beforeend",'<th class="act" style="width:1%;white-space:nowrap">Excluir</th>');
    tb.querySelectorAll("tbody tr[data-id]").forEach(tr=>{const id=tr.getAttribute("data-id");if(!id||tr.querySelector(".act"))return;const td=document.createElement("td");td.className="act";tr.appendChild(td);trashCtl(id,td)});}
  document.querySelectorAll("#view details[data-id]").forEach(d=>{const id=d.getAttribute("data-id"),sm=d.querySelector("summary");if(!id||!sm||sm.querySelector(".act"))return;const sp=document.createElement("span");sp.className="act";sp.style.float="right";sm.appendChild(sp);trashCtl(id,sp)});
}
async function del(id,td){
  td.innerHTML='<span class="cf" style="color:var(--muted)">Excluindo…</span>';
  try{
    const r=await fetch(window.APPS_SCRIPT_URL+"?action=delete&email="+encodeURIComponent(AUTH[0])+"&key="+encodeURIComponent(AUTH[1])+"&ts="+encodeURIComponent(id));
    const j=await r.json();
    if(j.ok){load(AUTH[0],AUTH[1])}else{td.innerHTML='<span class="cf">Não encontrada. Clique em Atualizar.</span>'}
  }catch(e){td.innerHTML='<span class="cf">Falha ao excluir. Tente de novo.</span>'}
}
function csv(){
  const cols=["Data","Questionário","Nome","Área","Empresa"];const qmap=[];
  FORMS.forEach(f=>f.sections.forEach(s=>s.qs.forEach(q=>{qmap.push([f.id,q.id]);cols.push(f.nav+" – "+q.l)})));
  const cell=v=>{v=Array.isArray(v)?v.join("; "):(v??"");v=String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[cols.map(cell).join(",")];
  RAW.forEach(r=>{const row=[new Date(r.enviadoEm).toLocaleString("pt-BR"),(FORMS.find(f=>f.id===r.form)||{}).nav||r.form,r.nome,r.area,r.empresa];qmap.forEach(([fid,qid])=>row.push(fid===r.form?(r.respostas||{})[qid]:""));lines.push(row.map(cell).join(","))});
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="respostas_diagnostico_bim_fase01.csv";document.body.appendChild(a);a.click();a.remove();
}
async function load(email,key){
  $("#view").innerHTML=`<div class="empty">Carregando respostas…</div>`;
  try{
    const r=await fetch(window.APPS_SCRIPT_URL+"?email="+encodeURIComponent(email)+"&key="+encodeURIComponent(key));const j=await r.json();
    if(!j.ok){try{sessionStorage.removeItem("adminAuth")}catch(e){};login("E-mail ou senha incorretos.");return}
    try{sessionStorage.setItem("adminAuth",JSON.stringify([email,key]))}catch(e){}
    AUTH=[email,key];RAW=j.rows||[];allDocs=toDocs(RAW);render();
    const bar=document.createElement("div");bar.className="actions";
    bar.innerHTML=`<button class="primary" type="button" id="dl">Baixar respostas (Excel/CSV)</button><button class="ghost" type="button" id="rf">Atualizar</button><button class="ghost" type="button" id="out">Sair</button>`;
    let ab=document.getElementById("adminbar");if(!ab){ab=document.createElement("div");ab.id="adminbar";ab.className="wrap";ab.style.paddingTop="20px";$("main").prepend(ab)}ab.innerHTML="";ab.appendChild(bar);
    $("#dl").onclick=csv;$("#rf").onclick=()=>load(email,key);$("#out").onclick=()=>{try{sessionStorage.removeItem("adminAuth")}catch(e){};AUTH=null;login()};

    $("#view").innerHTML=`<div class="notice"><b>Não foi possível carregar as respostas.</b><br>Endereço configurado em config.js: <code style="word-break:break-all">${esc(u)}</code><br>${ok?'O formato do endereço está certo. Clique em <b>Testar conexão</b>: deve abrir uma página com {"ok":false}. Se abrir login do Google ou erro, ajuste a implantação (Quem pode acessar: Qualquer pessoa) e crie uma Nova versão.':'<b>O endereço não está no formato certo.</b> Ele precisa começar com https://script.google.com/macros/s/ e terminar em /exec.'}</div>
    <div class="actions">${ok?`<a class="ghost" style="text-decoration:none;font-family:var(--display);font-weight:700;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:12px 20px;color:var(--fg)" href="${esc(u)}?email=teste&key=teste" target="_blank" rel="noopener">Testar conexão</a>`:''}<button class="primary" type="button" id="relog">Entrar novamente</button></div>`;
    $("#relog").onclick=()=>{try{sessionStorage.removeItem("adminAuth");sessionStorage.removeItem("adminKey")}catch(e){};login()}}
}
function login(msg){
  renderTabs();const ab0=document.getElementById("adminbar");if(ab0)ab0.remove();
  $("#view").innerHTML=`<div class="intro"><div class="eyebrow">Somente equipe CSBIM</div><h2>Área de admin</h2></div>

  <p style="margin:-6px 0 0;color:var(--muted);max-width:60ch">Resultados, dashboard e pré-plano de ação do diagnóstico. Acesso restrito à equipe CSBIM.</p>
  <form id="lg" class="section" novalidate><div class="q"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username" inputmode="email"></div><div class="q"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password"></div>

  $("#lg").addEventListener("submit",e=>{e.preventDefault();const m=$("#em").value.trim().toLowerCase(),k=$("#pw").value;if(m&&k)load(m,k)});

let a0=null;try{a0=JSON.parse(sessionStorage.getItem("adminAuth")||"null")}catch(e){}
if(a0&&window.APPS_SCRIPT_URL)load(a0[0],a0[1]);else login();
