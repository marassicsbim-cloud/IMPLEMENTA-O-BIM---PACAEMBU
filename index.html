<style>
/* Layout: faixa de marca no topo, abas por questionário, formulário em coluna única de leitura (~720px) */
:root{
  --navy:#003D4C; --red:#E4002B; --yellow:#FFB81C;
  --bg:#FFFFFF; --surface:#FFFFFF; --field:#F6F9FA; --hdr:#FFFFFF; --hdr-fg:#003D4C; --logo-bg:transparent; --surface-2:#EAF0F1; --line:#D3DEE1;
  --fg:#14262B; --muted:#56707A; --accent:#003D4C; --accent-fg:#FFFFFF;
  --chip:#E1EBED; --ok:#1E6B34; --ok-bg:#E3F1E6; --warn-bg:#FFF4D6;
  --focus:#E4002B;
  --display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.brand{background:var(--hdr);color:var(--hdr-fg)}
header.brand .wrap{padding-block:28px 22px;display:flex;flex-direction:column;gap:14px}
.logo{background:var(--logo-bg);border-radius:8px;padding:8px 10px 8px 0;align-self:flex-start;display:flex}
.logo img{height:40px;max-width:100%;width:auto;display:block}
header h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);max-width:62ch}
.stripe{height:6px;display:grid;grid-template-columns:70% 2% 28%}
.stripe i:nth-child(1){background:var(--navy)}
.stripe i:nth-child(2){background:var(--yellow)}
.stripe i:nth-child(3){background:var(--red)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);text-decoration:none;padding:14px 12px 12px;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
nav.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--red)}
nav.tabs a .n{font-variant-numeric:tabular-nums;font-size:11px;background:var(--chip);color:var(--fg);border-radius:10px;padding:1px 7px}
nav.tabs a .done{color:var(--ok)}
main .wrap{padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
.intro{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;line-height:1.2;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:14px}
.meta span{background:var(--chip);border-radius:4px;padding:2px 8px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:18px}
.section h3{font-family:var(--display);font-size:15px;font-weight:700;margin:0;color:var(--accent);display:flex;gap:10px;align-items:baseline}
.section h3 small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:13px}
.q{display:flex;flex-direction:column;gap:8px}
.q>label,.q>.lbl{font-weight:600}
.q .hint{color:var(--muted);font-size:14px;margin-top:-4px}
.req{color:var(--red)}
input[type=text],input[type=email],input[type=number],select,textarea{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
textarea{min-height:92px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.opt input:focus-visible+span,.scale input:focus-visible+span,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--field);font-size:15px;cursor:pointer}
.opt input:checked+span{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale label{position:relative}
.scale input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.scale span{display:flex;align-items:center;justify-content:center;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--field);font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.scale input:checked+span{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button{font-family:var(--display);font-weight:700;font-size:14px;border-radius:6px;padding:12px 20px;border:1px solid transparent;cursor:pointer}
.primary{background:var(--red);color:#fff}
.primary:disabled{opacity:.55;cursor:not-allowed}
.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.status{font-size:14px;color:var(--muted)}
.status.ok{color:var(--ok);font-weight:600}
.status.err{color:var(--red);font-weight:600}
.notice{border-radius:8px;padding:12px 16px;background:var(--warn-bg);font-size:15px}
.notice.ok{background:var(--ok-bg)}
/* resultados */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.card b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.card small{color:var(--muted);font-size:13px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar b{font-variant-numeric:tabular-nums;text-align:right}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
td .pill{display:inline-block;font-size:12px;border-radius:10px;padding:1px 8px;background:var(--chip);margin:1px 2px 1px 0}
td .pill.on{background:var(--ok-bg);color:var(--ok);font-weight:600}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details summary{cursor:pointer;padding:12px 16px;font-weight:600}
details dl{margin:0;padding:0 16px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
details dt{color:var(--muted);font-size:13px;margin-top:8px}
details dd{margin:0;white-space:pre-wrap}
.empty{color:var(--muted);text-align:center;padding:28px 16px;border:1px dashed var(--line);border-radius:8px}
footer{color:var(--muted);font-size:13px}
h2.block{font-size:18px;margin-top:10px;padding-top:14px;border-top:2px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid2>*{min-width:0}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:14px}
.hb-l{overflow-wrap:anywhere}
.hb .track{position:relative;height:14px;background:var(--surface-2);border-radius:4px}
.hb .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.hb .fill.low{background:var(--red)}
.hb .ref{position:absolute;left:50%;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--muted)}
.hb b{font-variant-numeric:tabular-nums;text-align:right}
.scored+.axisnote{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 34px;gap:10px;font-size:11px;color:var(--muted)}
.ax{position:relative;height:14px}.ax span{position:absolute;top:0}.ax .m{left:50%;transform:translateX(-50%)}.ax .e{right:0}
.cnote{margin:0;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
table.heat td.hc{background:color-mix(in srgb,var(--accent) var(--p),var(--surface));text-align:center;font-variant-numeric:tabular-nums;font-weight:600;border:2px solid var(--surface)}
table.heat td.hc span.inv{color:var(--accent-fg)}
table.heat th:not(:first-child){text-align:center}
.pri{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;border-radius:4px;padding:2px 8px;white-space:nowrap}
.p-a{background:var(--red);color:#fff}.p-m{background:var(--yellow);color:#14262B}.p-b{background:var(--chip);color:var(--fg)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
header.brand .wrap{position:relative}
.admbtn{position:absolute;top:28px;right:max(16px,env(safe-area-inset-right,0px));display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:13px;text-decoration:none;color:#fff;background:var(--navy);border-radius:6px;padding:10px 16px}
.admbtn:hover{background:var(--red)}
.admbtn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (max-width:620px){.admbtn{top:24px;padding:8px 12px}header.brand .logo{max-width:calc(100% - 110px)}header.brand .logo img{width:100%;height:auto}}
</style>
</head>

<script>
const SCALE_ENDS=["Discordo totalmente","Concordo totalmente"];
const FORMS=[
 {id:"maturidade",nav:"Maturidade BIM",title:"Questionário de maturidade BIM",who:"Equipe técnica da Pacaembu",time:"10–15 min",
  intro:"Responda com base no seu dia a dia hoje. Não existe resposta certa: o objetivo é entender o ponto de partida da equipe.",
  sections:[
   {t:"Perfil",qs:[
    {id:"nome",l:"Nome",type:"text",req:1},
    {id:"area",l:"Área",type:"radio",req:1,o:["Projetos","Orçamento","Planejamento","Obras","Incorporação / Comercial","TI","Diretoria","Outra"]},
    {id:"funcao",l:"Função ou cargo",type:"text"},
    {id:"tempo",l:"Tempo de empresa",type:"radio",o:["Menos de 1 ano","1 a 3 anos","3 a 5 anos","Mais de 5 anos"]},
    {id:"lotes",l:"Você participa dos projetos de loteamento?",type:"radio",o:["Sim, diretamente","Às vezes","Não"]}]},
   {t:"Pessoas",dim:"Pessoas",qs:[
    {id:"p1",l:"Conheço os conceitos de BIM e como ele se aplica a infraestrutura.",type:"scale",dim:"Pessoas"},
    {id:"p2",l:"Tenho experiência prática com o Civil 3D.",type:"scale",dim:"Pessoas"},
    {id:"p3",l:"Tenho experiência com Navisworks ou outra ferramenta de compatibilização.",type:"scale",dim:"Pessoas"},
    {id:"p4",l:"Consigo abrir e consultar modelos 3D ou IFC recebidos dos projetistas.",type:"scale",dim:"Pessoas"},
    {id:"p5",l:"Tenho interesse em ser capacitado em BIM.",type:"scale",dim:"Pessoas"}]},
   {t:"Processos",qs:[
    {id:"r1",l:"Os projetos dos loteamentos seguem um padrão de entrega definido pela Pacaembu.",type:"scale",dim:"Processos"},
    {id:"r2",l:"As interferências entre disciplinas são identificadas antes de chegar à obra.",type:"scale",dim:"Processos"},
    {id:"r3",l:"Os quantitativos para orçamento são extraídos de forma confiável e rastreável.",type:"scale",dim:"Processos"},
    {id:"r4",l:"O planejamento da obra está conectado aos projetos.",type:"scale",dim:"Processos"},
    {id:"r5",l:"Fica sempre claro qual é a versão vigente de cada projeto.",type:"scale",dim:"Processos"}]},
   {t:"Tecnologia",qs:[
    {id:"t1",l:"Os arquivos de projeto ficam em um local centralizado e fácil de acessar.",type:"scale",dim:"Tecnologia"},
    {id:"t2",l:"Meu computador atende bem aos softwares que uso.",type:"scale",dim:"Tecnologia"},
    {id:"t3",l:"A troca de arquivos com os projetistas é organizada.",type:"scale",dim:"Tecnologia"},

    {id:"softs_outros",l:"Outros softwares",type:"text"}]},
   {t:"Expectativas",qs:[
    {id:"dores",l:"Quais são as maiores dificuldades hoje no ciclo de projeto dos loteamentos?",type:"textarea"},
    {id:"espera",l:"O que você espera que o BIM melhore no seu trabalho?",type:"textarea"}]}
  ]},
 {id:"tecnologia",nav:"Tecnologia",title:"Inventário de tecnologia",who:"TI e coordenação",time:"15 min",
  intro:"Levantamento da infraestrutura atual para dimensionar hardware, licenças e o ambiente comum de dados (CDE).",
  sections:[
   {t:"Responsável",qs:[{id:"nome",l:"Nome",type:"text",req:1},{id:"funcao",l:"Função",type:"text"}]},
   {t:"Computadores",qs:[
    {id:"qtd_pc",l:"Quantos computadores a área técnica usa?",type:"number"},
    {id:"tipo_pc",l:"Tipo predominante",type:"radio",o:["Notebooks","Desktops","Misto"]},
    {id:"config",l:"Configuração típica (processador, memória RAM, placa de vídeo, SSD)",type:"textarea",hint:"Ex.: Intel Core i5-13450HX, 16 GB, RTX 3050 6 GB, SSD 512 GB"},
    {id:"so",l:"Sistema operacional",type:"radio",o:["Windows 11","Windows 10","Misto","Outro"]},
    {id:"renovacao",l:"Existe previsão de renovação de equipamentos?",type:"radio",o:["Sim, nos próximos 6 meses","Sim, em mais de 6 meses","Não"]}]},
   {t:"Softwares e licenças",qs:[
    {id:"licencas",l:"Softwares e licenças atuais",type:"textarea",hint:"Uma linha por software: nome, quantidade, tipo de licença e vencimento"},
    {id:"autodesk",l:"A Pacaembu tem contrato com a Autodesk hoje?",type:"radio",o:["Sim","Não","Não sei"]},

function qHTML(q,fid,val){
  const id=`${fid}-${q.id}`, req=q.req?' <span class="req">*</span>':'', hint=q.hint?`<div class="hint">${esc(q.hint)}</div>`:'';
  if(q.type==="text"||q.type==="number") return `<div class="q"><label for="${id}">${esc(q.l)}${req}</label>${hint}<input id="${id}" name="${q.id}" type="${q.type==="number"?"number":"text"}" ${q.type==="number"?'min="0" inputmode="numeric"':''} ${q.req?'required':''} value="${esc(val??"")}"></div>`;
  if(q.type==="textarea") return `<div class="q"><label for="${id}">${esc(q.l)}${req}</label>${hint}<textarea id="${id}" name="${q.id}">${esc(val??"")}</textarea></div>`;
  if(q.type==="radio"||q.type==="check"){
    const t=q.type==="radio"?"radio":"checkbox", arr=Array.isArray(val)?val:[val];
    return `<div class="q" role="group" aria-labelledby="${id}-l"><div class="lbl" id="${id}-l">${esc(q.l)}${req}${q.type==="check"?' <small class="hint">(marque quantas quiser)</small>':''}</div>${hint}<div class="opts">${q.o.map((o,i)=>`<label class="opt"><input type="${t}" id="${id}-${i}" name="${q.id}" value="${esc(o)}" ${arr.includes(o)?'checked':''} ${q.req&&t==="radio"?'required':''}><span>${esc(o)}</span></label>`).join("")}</div></div>`;
  }
  if(q.type==="scale") return `<div class="q" role="group" aria-labelledby="${id}-l"><div class="lbl" id="${id}-l">${esc(q.l)}</div><div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" id="${id}-${n}" name="${q.id}" value="${n}" ${String(val)===String(n)?'checked':''}><span>${n}</span></label>`).join("")}</div><div class="scale-ends"><span>1 · ${SCALE_ENDS[0]}</span><span>5 · ${SCALE_ENDS[1]}</span></div></div>`;
}

function collect(f){
  const frm=$("#frm"), out={};
  f.sections.forEach(s=>s.qs.forEach(q=>{
    if(q.type==="check") out[q.id]=[...frm.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i=>i.value);
    else if(q.type==="radio"||q.type==="scale"){const c=frm.querySelector(`input[name="${q.id}"]:checked`);out[q.id]=c?(q.type==="scale"?Number(c.value):c.value):null}
    else{const el=frm.querySelector(`[name="${q.id}"]`);out[q.id]=el?el.value.trim():""}
  }));
  return out;
}
async function submit(f){
  const st=$("#st"), btn=$("#send"), ans=collect(f);
  const missing=f.sections.flatMap(s=>s.qs).filter(q=>q.req&&(!ans[q.id]||(Array.isArray(ans[q.id])&&!ans[q.id].length)));
  if(missing.length){st.className="status err";st.textContent="Preencha: "+missing.map(q=>q.l).join(", ")+".";return}
  if(!window.APPS_SCRIPT_URL){st.className="status err";st.textContent="Formulário ainda não conectado ao armazenamento.";return}
  btn.disabled=true;st.className="status";st.textContent="Enviando…";
  const perguntas={};f.sections.forEach(s=>s.qs.forEach(q=>perguntas[q.id]=q.l));
  const payload={form:f.id,titulo:f.title,nome:ans.nome||"",area:ans.area||"",empresa:ans.empresa||"",respostas:ans,perguntas,enviadoEm:new Date().toISOString()};
  try{
    await fetch(window.APPS_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    store.set("draft-"+f.id,null);
    mine[f.id]={respostas:ans,enviadoEm:payload.enviadoEm};store.set("enviados",mine);
    st.className="status ok";st.textContent="Respostas enviadas. Obrigado!";renderTabs();
  }catch(e){st.className="status err";st.textContent="Não foi possível enviar agora. Verifique a internet e tente novamente."}
  finally{btn.disabled=false}
}

   <div class="grid2">
   ${chartCard("Usos BIM mais pedidos",`${pro.length} resposta${pro.length===1?'':'s'} de Processos`,countBars(usos,pro.length,"respostas"))}
   ${chartCard("Softwares usados pela equipe",`${mat.length} resposta${mat.length===1?'':'s'}`,countBars(softs,mat.length,"pessoas"))}
   ${chartCard("Onde ficam os arquivos","Inventário de tecnologia",countBars(armaz,tec.length,"respostas"))}
   ${chartCard("Projetistas: versão do Civil 3D",`${prj.length} escritório${prj.length===1?'':'s'}`,countBars(pver,prj.length,"escritórios"))}
   </div>
   ${prj.length?chartCard("Projetistas: softwares usados","",countBars(psoft,prj.length,"escritórios")):''}

   <h2 class="block">Pré-plano de ação</h2>
   <p style="margin:-8px 0 0;max-width:65ch;color:var(--muted)">Gerado das respostas: cada afirmação com média abaixo de 3,5 vira uma linha. Prioridade alta abaixo de 2,5; média entre 2,5 e 3; baixa entre 3 e 3,5. Use como rascunho para o PIB (atividade 1.7).</p>
   ${plan.length?`<div class="tbl"><table class="plan"><thead><tr><th>Prioridade</th><th>Lacuna</th><th>Ação sugerida</th><th>Etapa</th><th>Média</th></tr></thead><tbody>${plan.map(p=>`<tr><td><span class="pri p-${p.pri==="Alta"?"a":p.pri==="Média"?"m":"b"}">${p.pri==="Alta"?"▲":p.pri==="Média"?"■":"▼"} ${p.pri}</span></td><td>${esc(p.lac)}<br><small class="muted">${esc(p.src)}</small></td><td>${esc(p.acao)}</td><td>${esc(ETAPAS[p.etapa])}</td><td class="num">${p.v==null?"–":p.v.toFixed(1)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">O pré-plano aparece quando as respostas indicarem lacunas (médias abaixo de 3,5).</div>`}

   <h2 class="block">Quem respondeu</h2>
   ${rows.length?`<div class="tbl"><table><thead><tr><th>Nome</th><th>Área / empresa</th><th>Questionários</th><th>Atualizado</th></tr></thead><tbody>
    ${rows.map(d=>`<tr><td>${esc(d.nome||"—")}</td><td>${esc(d.empresa||d.area||"—")}</td><td>${FORMS.map(f=>`<span class="pill ${d.forms?.[f.id]?'on':''}">${esc(f.nav)}</span>`).join("")}</td><td>${d.atualizadoEm?new Date(d.atualizadoEm).toLocaleDateString("pt-BR"):"—"}</td></tr>`).join("")}
   </tbody></table></div>
   ${showSample?'':`<div style="display:flex;flex-direction:column;gap:10px">${rows.map(d=>`<details><summary>${esc(d.nome||"Sem nome")} ${d.empresa?'· '+esc(d.empresa):''}</summary><dl>${FORMS.filter(f=>d.forms?.[f.id]).map(f=>{const r=d.forms[f.id].respostas||{};return `<dt style="color:var(--red);font-weight:700;font-family:var(--display)">${esc(f.title)}</dt>`+f.sections.flatMap(s=>s.qs).map(q=>{const v=r[q.id];const t=Array.isArray(v)?v.join(", "):(v??"");return t===""||t===null?"":`<dt>${esc(q.l)}</dt><dd>${esc(t)}</dd>`}).join("")}).join("")}</dl></details>`).join("")}</div>`}`
   :`<div class="empty">Nenhuma resposta ainda. Compartilhe o link desta página com a equipe e os projetistas.</div>`}`;
  $("#toggleSample").addEventListener("click",()=>{showSample=!showSample;renderResults()});
}

function render(){renderTabs();const c=current();if(c==="respostas")renderResults();else renderForm(FORMS.find(f=>f.id===c))}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
mine=store.get("enviados")||{};
render();
</script>
</body>
</html>
